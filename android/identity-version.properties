# LA APP DE IDENTIDAD, en un solo sitio. Dos números distintos:
#
# versionCode / versionName: la versión de la app de identidad. Sube en cada release suyo.
#
# minVersionCode: la MÍNIMA que exigen las apps compiladas con esta librería
# (IdentityClient.MIN_VERSION_CODE). Sube SOLO con un cambio INCOMPATIBLE entre las apps y la
# identidad (el servicio, sus mensajes, sus formatos o sus códigos): un arreglo o un cambio de
# pantalla no la toca, porque subirla obliga a todo el mundo a actualizar Identidad. Cuando
# sube, la Identidad nueva va a Play ANTES que las apps.
versionCode=11
versionName=0.2.9
# 0.2.8 (10): la primera que lee binario; desde ahí el servicio no ha cambiado.
minVersionCode=10
